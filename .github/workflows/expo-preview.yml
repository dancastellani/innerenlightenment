# Publishes each app PR with EAS Update and comments a QR code that opens it in Expo Go.
# Turned off: Dan chose not to store an Expo token in GitHub and publishes previews from
# his laptop instead (docs/tech-stack.md). To turn it back on, remove `if: false` below
# and add the EXPO_TOKEN secret.
name: Expo preview

on:
  pull_request:
    paths: ['mobile/**', 'content/**']

jobs:
  preview:
    if: false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        if: env.EXPO_TOKEN != ''
      - uses: actions/setup-node@v6
        if: env.EXPO_TOKEN != ''
        with:
          node-version: 24
      - uses: expo/expo-github-action@v8
        if: env.EXPO_TOKEN != ''
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
        if: env.EXPO_TOKEN != ''
        working-directory: mobile
      - uses: expo/expo-github-action/preview@v8
        if: env.EXPO_TOKEN != ''
        with:
          working-directory: mobile
          qr-target: expo-go
          # Each PR gets its own update branch, so previews of open PRs coexist and none reaches a store build.
          command: eas update --auto --branch pr-${{ github.event.pull_request.number }}
