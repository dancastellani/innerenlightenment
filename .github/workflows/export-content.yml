name: Export messages

# Pulls all messages from fonteviva.org and opens a PR when content/pt.json changes.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m scripts.export_fonteviva content/pt.json
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: content/export-pt
          commit-message: Update Portuguese messages from fonteviva.org
          title: Update Portuguese messages from fonteviva.org
          body: Automated export of all messages from https://fonteviva.org/ via its WordPress REST API.
          add-paths: content/pt.json
