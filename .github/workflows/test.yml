name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  checks: write # to add the test report check run
  contents: write # to publish the test count badge on the badges branch

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: ./run.sh test 2>&1 | tee test-report.txt
        shell: bash
      # Shows the test report on the workflow run's page on GitHub, also when a test failed.
      - if: always()
        run: |
          echo '## Test report' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat test-report.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      # Adds the translation check's list of problems to the same page.
      - if: always()
        run: node scripts/check-translations.ts >> "$GITHUB_STEP_SUMMARY"
      # Adds a "Test report" check run that lists every test and spec scenario in the PR's Checks tab.
      # node --test puts tests without a describe() straight under <testsuites>, which the reporter skips,
      # so they are wrapped in a "Unit tests" suite first.
      - if: always()
        run: sed -i 's|<testsuites>|<testsuites><testsuite name="Unit tests">|; s|</testsuites>|</testsuite></testsuites>|' test-reports/unit.xml
      - if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Test report
          path: test-reports/*.xml
          reporter: java-junit
          use-actions-summary: false # create a check run instead of a summary section
      # Lists every message of every translation, grouped under the Portuguese message, as its own check run.
      - if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Translation report
          path: translation-reports/*.xml
          reporter: java-junit
          use-actions-summary: false
      # On main, publishes the counts for the README badge as a shields.io endpoint file on the "badges" branch.
      - if: always() && github.ref == 'refs/heads/main'
        run: |
          total=$(cat test-reports/*.xml | grep -o '<testcase' | wc -l)
          failed=$(cat test-reports/*.xml | grep -o '<failure' | wc -l)
          color=brightgreen
          if [ "$failed" -gt 0 ]; then color=red; fi
          mkdir badges && cd badges
          echo "{\"schemaVersion\":1,\"label\":\"tests\",\"message\":\"$((total - failed)) passed, $failed failed\",\"color\":\"$color\"}" > tests.json
          git init -q -b badges
          git add tests.json
          git -c user.name=github-actions -c user.email=github-actions@github.com commit -qm "Update test count badge"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" badges
