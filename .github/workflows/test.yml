name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  checks: write # to add the test report check run

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: ./run.sh test 2>&1 | tee test-report.txt
        shell: bash
      # Shows the test report on the workflow run's page on GitHub, also when a test failed.
      - if: always()
        run: |
          echo '## Test report' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat test-report.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      # Adds the translation check's list of problems to the same page.
      - if: always()
        run: node scripts/check-translations.ts >> "$GITHUB_STEP_SUMMARY"
      # Adds a "Test report" check run that lists every test and spec scenario in the PR's Checks tab.
      # node --test puts tests without a describe() straight under <testsuites>, which the reporter skips,
      # so they are wrapped in a "Unit tests" suite first.
      - if: always()
        run: sed -i 's|<testsuites>|<testsuites><testsuite name="Unit tests">|; s|</testsuites>|</testsuite></testsuites>|' test-reports/unit.xml
      - if: always()
        uses: dorny/test-reporter@v2
        with:
          name: Test report
          path: test-reports/*.xml
          reporter: java-junit
          use-actions-summary: false # create a check run instead of a summary section
