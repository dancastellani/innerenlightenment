# On every merge to main that changes the app, builds the installable Android APK and iOS app
# (the "preview" profile in eas.json) on Expo's servers, but only when the native side changed
# (new native package or SDK). Otherwise it publishes the change as an update to the "preview"
# channel, which installed preview builds download on their next start. This keeps within
# the free plan's 15 builds per platform per month (docs/tech-stack.md#app-builds-eas-workflows).
name: Builds

on:
  push:
    branches: ['main']
    paths: ['mobile/**', 'content/**']

jobs:
  fingerprint:
    name: Fingerprint the native side
    type: fingerprint
    environment: preview

  get_android_build:
    name: Find an Android build with this fingerprint
    needs: [fingerprint]
    type: get-build
    params:
      platform: android
      profile: preview
      fingerprint_hash: ${{ needs.fingerprint.outputs.android_fingerprint_hash }}

  get_ios_build:
    name: Find an iOS build with this fingerprint
    needs: [fingerprint]
    type: get-build
    params:
      platform: ios
      profile: preview
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}

  build_android:
    name: Build the Android APK
    needs: [get_android_build]
    if: ${{ !needs.get_android_build.outputs.build_id }}
    type: build
    params:
      platform: android
      profile: preview

  build_ios:
    name: Build the iOS app
    needs: [get_ios_build]
    if: ${{ !needs.get_ios_build.outputs.build_id }}
    type: build
    params:
      platform: ios
      profile: preview

  # An update only goes to a platform whose build already has this fingerprint: an older build
  # lacks the new native code, and its users get the new build instead.
  update_android:
    name: Publish to installed Android preview builds
    needs: [get_android_build]
    if: ${{ needs.get_android_build.outputs.build_id }}
    type: update
    environment: preview
    params:
      channel: preview
      platform: android

  update_ios:
    name: Publish to installed iOS preview builds
    needs: [get_ios_build]
    if: ${{ needs.get_ios_build.outputs.build_id }}
    type: update
    environment: preview
    params:
      channel: preview
      platform: ios
