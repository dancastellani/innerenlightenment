# On every merge to main that changes the app, builds the installable Android APK (the "preview"
# profile in eas.json) and an iOS simulator app (the "ios-simulator" profile, which needs no Apple
# account) on Expo's servers, but only when the native side changed
# (new native package or SDK). Otherwise it publishes the change as an update to the "preview"
# channel, which installed Android preview builds download on their next start. The iOS simulator
# build only checks that the app compiles for iOS, so it has no update job. This keeps within
# the free plan's 15 builds per platform per month (docs/tech-stack.md#app-builds-eas-workflows).
name: Builds

# Switched off for now, to save credits: it does not run on merges to main. Run it by hand with
#   cd mobile && npx eas-cli@latest workflow:run .eas/workflows/builds.yml
# To switch it on again, add back:
#   on:
#     push:
#       branches: ['main']
#       paths: ['mobile/**', 'content/**']

jobs:
  fingerprint:
    name: Fingerprint the native side
    type: fingerprint
    environment: preview

  get_android_build:
    name: Find an Android build with this fingerprint
    needs: [fingerprint]
    type: get-build
    params:
      platform: android
      profile: preview
      fingerprint_hash: ${{ needs.fingerprint.outputs.android_fingerprint_hash }}

  get_ios_build:
    name: Find an iOS build with this fingerprint
    needs: [fingerprint]
    type: get-build
    params:
      platform: ios
      profile: ios-simulator
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}

  build_android:
    name: Build the Android APK
    needs: [get_android_build]
    if: ${{ !needs.get_android_build.outputs.build_id }}
    type: build
    params:
      platform: android
      profile: preview

  build_ios:
    name: Build the iOS app
    needs: [get_ios_build]
    if: ${{ !needs.get_ios_build.outputs.build_id }}
    type: build
    params:
      platform: ios
      profile: ios-simulator

  # An update only goes to a platform whose build already has this fingerprint: an older build
  # lacks the new native code, and its users get the new build instead.
  update_android:
    name: Publish to installed Android preview builds
    needs: [get_android_build]
    if: ${{ needs.get_android_build.outputs.build_id }}
    type: update
    environment: preview
    params:
      channel: preview
      platform: android
